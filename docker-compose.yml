services:
  redis:
    image: redis:7-alpine
    container_name: internovayz_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: internovayz_backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8002
    container_name: internovayz_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
